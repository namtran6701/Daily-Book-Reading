name: Commit daily learning note

on:
  schedule:
    - cron: "55 23 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      note_date:
        description: "Optional date to export (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-learning-note
  cancel-in-progress: false

jobs:
  export-and-commit:
    runs-on: ubuntu-latest
    env:
      DAILY_LOG_URL: https://cloud-architect-study-hub.sales-factor-2223.chatgpt.site
      REQUESTED_DATE: ${{ inputs.note_date }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Export the daily note
        id: export
        shell: bash
        run: |
          set -euo pipefail

          note_date="${REQUESTED_DATE:-}"
          if [[ -z "$note_date" ]]; then
            note_date="$(TZ=America/New_York date +%F)"
          fi
          if [[ ! "$note_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid note date: $note_date" >&2
            exit 1
          fi

          response_file="$RUNNER_TEMP/daily-note.md"
          status="$(curl --silent --show-error --location \
            --retry 3 --retry-all-errors \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --header "OAI-Sites-Authorization: Bearer ${{ secrets.SITE_BYPASS_TOKEN }}" \
            --header "X-Daily-Export-Key: ${{ secrets.DAILY_EXPORT_KEY }}" \
            "$DAILY_LOG_URL/api/export/daily?date=$note_date")"

          if [[ "$status" == "204" ]]; then
            echo "No completed note exists for $note_date; nothing to commit."
            echo "has_note=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$status" != "200" ]]; then
            echo "Daily note export failed with HTTP $status." >&2
            exit 1
          fi

          year="${note_date:0:4}"
          month="${note_date:5:2}"
          note_path="daily-learning/$year/$month/$note_date.md"
          mkdir -p "$(dirname "$note_path")"
          mv "$response_file" "$note_path"
          echo "has_note=true" >> "$GITHUB_OUTPUT"
          echo "note_date=$note_date" >> "$GITHUB_OUTPUT"
          echo "note_path=$note_path" >> "$GITHUB_OUTPUT"

      - name: Commit the note
        if: steps.export.outputs.has_note == 'true'
        shell: bash
        run: |
          set -euo pipefail
          note_path="${{ steps.export.outputs.note_path }}"
          note_date="${{ steps.export.outputs.note_date }}"

          if git diff --quiet -- "$note_path"; then
            echo "The repository already has the latest version of $note_date."
            exit 0
          fi

          git config user.name "daily-learning-bot"
          git config user.email "daily-learning-bot@users.noreply.github.com"
          git add "$note_path"
          git commit -m "docs: add daily learning note for $note_date"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
